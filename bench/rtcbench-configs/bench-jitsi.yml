apiVersion: rtcbench/v1
kind: VideoCallStressTest
metadata:
  name: bench-jitsi
spec:
  plugin: jitsi
  conference:
    name: room-1234
    usersPerRoom: $env:VIEWERS_PER_ROOM=10
    totalRooms: $env:TOTAL_ROOMS=1
    cameras:
      perRoom: 0
    joinPolicy:
      concurrency: $env:VIEWERS_PER_ROOM=10
  pluginConfig:
    jitsi:
      _boshURL: 'https://{{spec.network.serverIP}}/http-bind'
      _domain: '{{spec.network.serverIP}}'
  network:
    serverIP: $env:SERVER_IP
  metrics:
    port: 9090
    statsJSONLPath: $env:STATS_JSONL_PATH=
  logging:
    console: true
    directory: $env:LOG_DIR=/tmp/bench-logs
    streams:
      - name: general
        level: info
      - name: signaling
        level: info
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
