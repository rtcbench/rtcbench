apiVersion: call.zip/v1
kind: VideoCallStressTest
metadata:
  name: stress-test-1
spec:
  plugin: $env:PLUGIN_NAME=janus
  conference:
    name: room-1234
    viewers: 1
    totalRooms: 1
    cameras:
      perRoom: 0
      fileType: ivf
      videoCodec: vp9
      directory: '~/vp9_ivf_videos'
    joinPolicy:
      concurrency: 10
      viewersAlwaysRetry: true
      joinStartSpacing: 2s
    recording:
      enabled: false
      directory: './vp9_ivf_files'
  network:
    serverIP: $env:SERVER_IP=10.99.0.209
    # clientIP: 10.99.0.2  # omitted for auto-detection
  pluginConfig:  # plugin-specific internal configuration
    jitsi:
      boshURL: 'https://10.99.0.210/http-bind'
      domain: '10.99.0.210'
    janus:
      serverRoot: 'https://10.99.0.209/janus'
      allowInsecureHttps: true
  logging:
    console: true
    directory: '/var/log/call-zip'
    streams:
      - name: general
        level: info
      - name: signaling
        level: debug
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
