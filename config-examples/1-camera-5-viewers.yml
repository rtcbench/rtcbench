apiVersion: rtcbench/v1
kind: VideoCallStressTest
metadata:
  name: 1-camera-5-viewers
spec:
  plugin: $env:PLUGIN_ID
  scenario: default
  conference:
    name: $env:ROOM_ID
    usersPerRoom: 6
    totalRooms: 1
    cameras:
      perRoom: 1
      fileType: ivf
      videoCodec: vp9
      directory: '/Users/m1-03/vp9_ivf_videos'
    joinPolicy:
      concurrency: 10
      alwaysRetryFailedJoins: true
      joinStartSpacing: 2s
    # This example uses the built-in "default" scenario:
    # join the configured users and keep them connected until shutdown.
    # packetCapture:
    #   enabled: false
    #   directory: '/tmp/captures'
  network:
    serverIP: $env:SERVER_IP
  pluginConfig:
    jitsi:
      _boshURL: 'https://{{spec.network.serverIP}}/http-bind'
      _domain: '{{spec.network.serverIP}}'
    janus:
      _serverRoot: 'https://{{spec.network.serverIP}}/janus'
      allowInsecureHttps: true
    livekit:
      _wsURL: 'ws://{{spec.network.serverIP}}:7880'
      apiKey: devkey
      apiSecret: secret-secret-secret-secret-secret
    mediasoup:
      _serverURL: 'wss://{{spec.network.serverIP}}:4443'
  logging:
    console: true
    directory: '/var/log/rtcbench'
    streams:
      - name: general
        level: info
      - name: signaling
        level: debug
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
