apiVersion: rtcbench/v1
kind: VideoCallStressTest
metadata:
  name: thresholds-example
spec:
  plugin: $env:PLUGIN_ID=livekit
  scenario: default
  conference:
    name: room-1234
    usersPerRoom: 6
    totalRooms: 1
    cameras:
      perRoom: 1
      fileType: ivf
      videoCodec: vp9
      directory: '~/vp9_ivf_videos'
    joinPolicy:
      concurrency: 6
      alwaysRetryFailedJoins: true
      joinStartSpacing: 2s
  network:
    serverIP: $env:SERVER_IP
  pluginConfig:
    janus:
      _serverRoot: 'http://{{spec.network.serverIP}}:8088/janus'
      allowInsecureHttps: false
    jitsi:
      _boshURL: 'https://{{spec.network.serverIP}}/http-bind'
      _domain: '{{spec.network.serverIP}}'
    livekit:
      _wsURL: 'ws://{{spec.network.serverIP}}:7880'
      apiKey: devkey
      apiSecret: secret-secret-secret-secret-secret
    mediasoup:
      _serverURL: 'wss://{{spec.network.serverIP}}:4443'
  metrics:
    port: 9090
    thresholds:
      - op: join
        scenario: default
        maxFailureRate: 0.01
        maxP95: 3s
      - op: publish_video
        scenario: default
        role: sender
        maxFailureRate: 0.01
        maxP95: 2s
      - op: close
        scenario: default
        maxFailureRate: 0
        maxP99: 2s
  logging:
    console: true
    directory: '/var/log/rtcbench'
    streams:
      - name: general
        level: info
      - name: signaling
        level: debug
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
