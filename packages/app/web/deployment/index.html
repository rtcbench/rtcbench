<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Join a room | RTCBench</title>
    <style>
      :root {
        font: 16px system-ui;
        color-scheme: light dark;
        background: light-dark(#f5f5f5, #171717);
        color: light-dark(#222, #eee);
      }
      body {
        margin: 0;
      }
      header {
        padding: 24px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      form {
        display: flex;
        gap: 12px;
        align-items: end;
        flex-wrap: wrap;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 14px;
      }
      input,
      button {
        font: inherit;
        padding: 10px 14px;
        border: 1px solid #8886;
        border-radius: 10px;
        background: light-dark(white, #292929);
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #199bb0;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      #status {
        margin: 0 24px 16px;
        min-height: 24px;
      }
      #videos {
        padding: 0 24px 24px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        overflow: hidden;
        border-radius: 16px;
        background: light-dark(white, #292929);
      }
      video {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: contain;
        background: #111;
        display: block;
      }
      figcaption {
        padding: 8px 12px;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Join a room</h1>
      <form>
        <label
          >Room<input
            id="room"
            required
            pattern="[a-zA-Z0-9][a-zA-Z0-9_\-]{0,127}"
            value="room-1234"
            autocomplete="off" /></label
        ><button id="join">Join room</button>
      </form>
      <button id="camera" type="button" hidden>Enable camera</button
      ><button id="leave" type="button" hidden>Leave room</button>
    </header>
    <p id="status" role="status" aria-live="polite">
      Join a room to see its streams. Your camera starts off.
    </p>
    <main id="videos" aria-label="Video streams"></main>
    <script type="module" src="deployment-client.js"></script>
  </body>
</html>
