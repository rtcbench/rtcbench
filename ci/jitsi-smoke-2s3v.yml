apiVersion: call.zip/v1
kind: VideoCallStressTest
metadata:
  name: jitsi-smoke-2s3v
spec:
  plugin: jitsi
  conference:
    name: smoke-test-room
    usersPerRoom: 5
    totalRooms: 1
    cameras:
      perRoom: 2
      fileType: ivf
      videoCodec: vp9
      directory: /test-videos
    joinPolicy:
      concurrency: 5
      alwaysRetryFailedJoins: true
      joinStartSpacing: 2s
    recording:
      enabled: false
      directory: /tmp/recordings
  metrics:
    port: 9090

  network:
    serverIP: 172.20.0.20  # Jitsi web container - also used as XMPP domain
  pluginConfig:
    jitsi:
      _boshURL: 'https://{{spec.network.serverIP}}/http-bind'
      _domain: '{{spec.network.serverIP}}'
  logging:
    console: true
    directory: /var/log/call-zip
    streams:
      - name: general
        level: info
      - name: signaling
        level: debug
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
