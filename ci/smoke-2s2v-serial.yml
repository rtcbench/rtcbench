apiVersion: call.zip/v1
kind: VideoCallStressTest
metadata:
  name: smoke-2s2v-serial
spec:
  plugin: $env:PLUGIN_ID
  conference:
    name: room-1234
    usersPerRoom: 4
    totalRooms: 1
    cameras:
      perRoom: 2
      fileType: ivf
      videoCodec: vp9
      directory: /test-videos
      inMemory: false
    joinPolicy:
      concurrency: 1
      alwaysRetryFailedJoins: true
      joinStartSpacing: 2s
    recording:
      enabled: false
      directory: /tmp/recordings
  metrics:
    port: 9090

  network:
    serverIP: $env:SERVER_IP
  pluginConfig:
    janus:
      _serverRoot: 'http://{{spec.network.serverIP}}:8088/janus'
      allowInsecureHttps: false
    jitsi:
      _boshURL: 'https://{{spec.network.serverIP}}/http-bind'
      _domain: '{{spec.network.serverIP}}'
    livekit:
      _wsURL: 'ws://{{spec.network.serverIP}}:7880'
      apiKey: devkey
      apiSecret: secret
    mediasoup:
      _serverURL: 'ws://{{spec.network.serverIP}}:4443'
  logging:
    console: true
    directory: /var/log/call-zip
    streams:
      - name: general
        level: info
      - name: signaling
        level: debug
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
