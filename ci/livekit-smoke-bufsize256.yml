apiVersion: call.zip/v1
kind: VideoCallStressTest
metadata:
  name: livekit-bufsize256-test
spec:
  plugin: livekit
  conference:
    name: livekit-bufsize256
    usersPerRoom: 2
    totalRooms: 1
    statsBufferSize: 256
    cameras:
      perRoom: 1
      fileType: ivf
      videoCodec: vp9
      directory: /test-videos
    joinPolicy:
      concurrency: 2
      alwaysRetryFailedJoins: true
      joinStartSpacing: 2s
    recording:
      enabled: false
      directory: /tmp/recordings
  metrics:
    port: 9090

  network:
    serverIP: 172.22.0.10
  pluginConfig:
    livekit:
      wsURL: ws://172.22.0.10:7880
      apiKey: devkey
      apiSecret: secret
  logging:
    console: true
    directory: /var/log/call-zip
    streams:
      - name: general
        level: info
      - name: signaling
        level: debug
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
