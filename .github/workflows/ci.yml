name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (make)
        run: make

      - name: Go tests
        run: make test

  smoke-test-janus:
    name: Smoke test – Janus
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build call.zip image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: callzip:latest
          cache-from: type=gha,scope=callzip
          cache-to: type=gha,mode=max,scope=callzip

      - name: Build Janus image
        uses: docker/build-push-action@v5
        with:
          context: docker/janus
          load: true
          tags: callzip-janus:latest
          cache-from: type=gha,scope=janus
          cache-to: type=gha,mode=max,scope=janus

      - name: Run Janus smoke test
        run: |
          docker compose --profile janus up \
            --exit-code-from janus-smoke-test \
            --abort-on-container-exit

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile janus logs

      - name: Cleanup
        if: always()
        run: docker compose --profile janus down -v

  smoke-test-jitsi:
    name: Smoke test – Jitsi
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build call.zip image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: callzip:latest
          cache-from: type=gha,scope=callzip
          cache-to: type=gha,mode=max,scope=callzip

      - name: Build Jitsi web image
        uses: docker/build-push-action@v5
        with:
          context: docker/jitsi
          load: true
          tags: callzip-jitsi-web:latest
          cache-from: type=gha,scope=jitsi-web
          cache-to: type=gha,mode=max,scope=jitsi-web

      - name: Run Jitsi smoke test
        run: |
          docker compose --profile jitsi up \
            --exit-code-from jitsi-smoke-test \
            --abort-on-container-exit

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile jitsi logs

      - name: Cleanup
        if: always()
        run: docker compose --profile jitsi down -v
