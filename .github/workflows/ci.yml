name: CI

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (make)
        run: make

      - name: Go tests
        run: make test

  e2e-janus:
    name: e2e – Janus
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rtcbench image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: rtcbench:latest
          cache-from: type=gha,scope=rtcbench
          cache-to: type=gha,mode=max,scope=rtcbench

      - name: Build Janus image
        uses: docker/build-push-action@v5
        with:
          context: docker/janus
          load: true
          tags: rtcbench-janus:latest
          cache-from: type=gha,scope=janus
          cache-to: type=gha,mode=max,scope=janus

      - name: Install Python e2e dependencies
        run: |
          pip install -r e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Run Janus e2e tests
        run: python -m pytest e2e/ -v -k janus --basetemp=/tmp/pytest-rtcbench

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose --project-name rtcbench-janus --profile janus logs

      - name: Cleanup
        if: always()
        run: docker compose --project-name rtcbench-janus --profile janus down -v

