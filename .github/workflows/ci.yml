name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (make)
        run: make

      - name: Go tests
        run: make test

  e2e-janus:
    name: e2e – Janus
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build call.zip image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: callzip:latest
          cache-from: type=gha,scope=callzip
          cache-to: type=gha,mode=max,scope=callzip

      - name: Build Janus image
        uses: docker/build-push-action@v5
        with:
          context: docker/janus
          load: true
          tags: callzip-janus:latest
          cache-from: type=gha,scope=janus
          cache-to: type=gha,mode=max,scope=janus

      - name: Install Python e2e dependencies
        run: pip install -r e2e/requirements.txt

      - name: Run Janus e2e tests
        run: python -m pytest e2e/ -v -k janus

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose --project-name callzip --profile janus logs

      - name: Cleanup
        if: always()
        run: docker compose --project-name callzip --profile janus down -v

  e2e-jitsi:
    name: e2e – Jitsi
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build call.zip image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: callzip:latest
          cache-from: type=gha,scope=callzip
          cache-to: type=gha,mode=max,scope=callzip

      - name: Build Jitsi web image
        uses: docker/build-push-action@v5
        with:
          context: docker/jitsi
          load: true
          tags: callzip-jitsi-web:latest
          cache-from: type=gha,scope=jitsi-web
          cache-to: type=gha,mode=max,scope=jitsi-web

      - name: Install Python e2e dependencies
        run: pip install -r e2e/requirements.txt

      - name: Run Jitsi e2e tests
        run: python -m pytest e2e/ -v -k jitsi

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose --project-name callzip --profile jitsi logs

      - name: Cleanup
        if: always()
        run: docker compose --project-name callzip --profile jitsi down -v
