apiVersion: rtcbench/v1
kind: VideoCallStressTest
metadata:
  name: bench-sender-load
spec:
  plugin: $env:PLUGIN_ID
  conference:
    name: room-1234
    usersPerRoom: $env:SENDERS_PER_ROOM=1
    totalRooms: $env:TOTAL_ROOMS=1
    cameras:
      perRoom: $env:SENDERS_PER_ROOM=1
      fileType: ivf
      videoCodec: vp9
      directory: $env:IVF_DIR=/opt/ivf-videos
      inMemory: true
      svc:
        mode: "off"
    joinPolicy:
      concurrency: $env:JOIN_CONCURRENCY=1
      joinStartSpacing: $env:JOIN_SPACING=0s
  network:
    serverIP: $env:SERVER_IP
  logging:
    console: true
    directory: $env:LOG_DIR=/tmp/bench-logs
    streams:
      - name: general
        level: info
      - name: signaling
        level: info
      - name: media
        level: info
      - name: packets
        level: info
      - name: video_stats
        level: info
