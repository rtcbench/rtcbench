networks:
  # Janus uses 172.20.0.0/24 — project callzip-janus creates callzip-janus_callzip-net
  callzip-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24

  # Jitsi uses 172.21.0.0/24 — project callzip-jitsi creates callzip-jitsi_callzip-jitsi-net
  # Separate subnet so both stacks can run in parallel without address conflicts.
  callzip-jitsi-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/24

  # LiveKit uses 172.22.0.0/24 — project callzip-livekit creates callzip-livekit_callzip-livekit-net
  callzip-livekit-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/24

  # Mediasoup uses 172.23.0.0/24 — project callzip-mediasoup creates callzip-mediasoup_callzip-mediasoup-net
  callzip-mediasoup-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.23.0.0/24

services:
  janus:
    profiles: [janus]
    build:
      context: docker/janus
    image: callzip-janus:latest
    networks:
      callzip-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/janus/info"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24

# Network layout (172.21.0.0/24):
#   172.21.0.20  jitsi-web      (nginx + BOSH proxy)  <- serverIP for call.zip
#   172.21.0.21  jitsi-prosody  (XMPP)
#   172.21.0.22  jitsi-jicofo   (focus component)
#   172.21.0.23  jitsi-jvb      (video bridge)
#
# The call.zip client hardcodes MUC as conference.<domain> and focus as focus.<domain>,
# so XMPP_MUC_DOMAIN and the focus component must follow that pattern.

  jitsi-prosody:
    profiles: [jitsi]
    image: jitsi/prosody:stable-9646
    restart: on-failure
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - XMPP_DOMAIN=172.21.0.20
      - XMPP_AUTH_DOMAIN=auth.172.21.0.20
      - XMPP_MUC_DOMAIN=conference.172.21.0.20
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.172.21.0.20
      - XMPP_RECORDER_DOMAIN=recorder.172.21.0.20
      - JICOFO_AUTH_PASSWORD=jicofosecret
      - JVB_AUTH_PASSWORD=jvbsecret
      - TZ=UTC
    networks:
      callzip-jitsi-net:
        ipv4_address: 172.21.0.21
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/5222' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24

  jitsi-jicofo:
    profiles: [jitsi]
    image: jitsi/jicofo:stable-9646
    restart: on-failure
    depends_on:
      jitsi-prosody:
        condition: service_healthy
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=0
      - XMPP_SERVER=172.21.0.21
      - XMPP_DOMAIN=172.21.0.20
      - XMPP_AUTH_DOMAIN=auth.172.21.0.20
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.172.21.0.20
      - XMPP_PORT=5222
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=jicofosecret
      - JICOFO_ENABLE_HEALTH_CHECKS=true
      - TZ=UTC
    networks:
      callzip-jitsi-net:
        ipv4_address: 172.21.0.22
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/about/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  jitsi-jvb:
    profiles: [jitsi]
    image: jitsi/jvb:stable-9646
    restart: on-failure
    depends_on:
      jitsi-prosody:
        condition: service_healthy
      jitsi-jicofo:
        condition: service_started
    environment:
      - XMPP_SERVER=172.21.0.21
      - XMPP_DOMAIN=172.21.0.20
      - XMPP_AUTH_DOMAIN=auth.172.21.0.20
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.172.21.0.20
      - XMPP_PORT=5222
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jvbsecret
      - JVB_ADVERTISE_IPS=172.21.0.23
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=true
      - TZ=UTC
    networks:
      callzip-jitsi-net:
        ipv4_address: 172.21.0.23
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/about/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  jitsi-web:
    profiles: [jitsi]
    build:
      context: docker/jitsi
    image: callzip-jitsi-web:latest
    restart: on-failure
    depends_on:
      jitsi-jicofo:
        condition: service_healthy
      jitsi-jvb:
        condition: service_healthy
    environment:
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - XMPP_SERVER=172.21.0.21
      - XMPP_DOMAIN=172.21.0.20
      - XMPP_AUTH_DOMAIN=auth.172.21.0.20
      - XMPP_MUC_DOMAIN=conference.172.21.0.20
      - XMPP_BOSH_URL_BASE=http://172.21.0.21:5280
      - PUBLIC_URL=https://172.21.0.20
      - TZ=UTC
    networks:
      callzip-jitsi-net:
        ipv4_address: 172.21.0.20
    healthcheck:
      test: ["CMD-SHELL", "curl -kso /dev/null -w '%{http_code}' https://localhost/ | grep -q '200'"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 18

  livekit:
    profiles: [livekit]
    build:
      context: docker/livekit
    image: callzip-livekit:latest
    networks:
      callzip-livekit-net:
        ipv4_address: 172.22.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:7880/ 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  mediasoup:
    profiles: [mediasoup]
    build:
      context: docker/mediasoup
    image: callzip-mediasoup:latest
    environment:
      - DOMAIN=172.23.0.10
      - MEDIASOUP_ANNOUNCED_ADDRESS=172.23.0.10
    networks:
      callzip-mediasoup-net:
        ipv4_address: 172.23.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -kso /dev/null https://localhost:4443/ || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24
