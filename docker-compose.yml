networks:
  callzip-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24

# Run with: docker compose --profile janus up --exit-code-from janus-smoke-test
services:
  janus:
    profiles: [janus]
    build:
      context: docker/janus
    image: callzip-janus:latest
    networks:
      callzip-net:
        ipv4_address: 172.20.0.10
    # Expose media ports so ICE UDP packets reach Janus from the client container.
    ports:
      - "10000-10200:10000-10200/udp"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/janus/info"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24

  janus-smoke-test:
    profiles: [janus]
    build:
      context: .
    image: callzip:latest
    depends_on:
      janus:
        condition: service_healthy
    networks:
      - callzip-net
    volumes:
      - ./ci:/ci:ro
    entrypoint:
      - /bin/sh
      - /ci/smoke-test.sh
      - /ci/janus-smoke.yml
      - "http://localhost:9090/health"
      - "120"

# Run with: docker compose --profile jitsi up --exit-code-from jitsi-smoke-test
#
# Network layout (172.20.0.20/24):
#   172.20.0.20  jitsi-web      (nginx + BOSH proxy)  ← serverIP for call.zip
#   172.20.0.21  jitsi-prosody  (XMPP)
#   172.20.0.22  jitsi-jicofo   (focus component)
#   172.20.0.23  jitsi-jvb      (video bridge)
#
# The call.zip client hardcodes MUC as conference.<domain> and focus as focus.<domain>,
# so XMPP_MUC_DOMAIN and the focus component must follow that pattern.

  jitsi-prosody:
    profiles: [jitsi]
    image: jitsi/prosody:stable-9646
    restart: on-failure
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - XMPP_DOMAIN=172.20.0.20
      - XMPP_AUTH_DOMAIN=auth.172.20.0.20
      - XMPP_MUC_DOMAIN=conference.172.20.0.20
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.172.20.0.20
      - XMPP_RECORDER_DOMAIN=recorder.172.20.0.20
      - JICOFO_AUTH_PASSWORD=jicofosecret
      - JVB_AUTH_PASSWORD=jvbsecret
      - TZ=UTC
    networks:
      callzip-net:
        ipv4_address: 172.20.0.21
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/5222' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24

  jitsi-jicofo:
    profiles: [jitsi]
    image: jitsi/jicofo:stable-9646
    restart: on-failure
    depends_on:
      jitsi-prosody:
        condition: service_healthy
    environment:
      - AUTH_TYPE=internal
      - ENABLE_AUTH=0
      - XMPP_SERVER=172.20.0.21
      - XMPP_DOMAIN=172.20.0.20
      - XMPP_AUTH_DOMAIN=auth.172.20.0.20
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.172.20.0.20
      - XMPP_PORT=5222
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=jicofosecret
      - JICOFO_ENABLE_HEALTH_CHECKS=true
      - TZ=UTC
    networks:
      callzip-net:
        ipv4_address: 172.20.0.22
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/about/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  jitsi-jvb:
    profiles: [jitsi]
    image: jitsi/jvb:stable-9646
    restart: on-failure
    depends_on:
      jitsi-prosody:
        condition: service_healthy
      jitsi-jicofo:
        condition: service_healthy
    environment:
      - XMPP_SERVER=172.20.0.21
      - XMPP_DOMAIN=172.20.0.20
      - XMPP_AUTH_DOMAIN=auth.172.20.0.20
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.172.20.0.20
      - XMPP_PORT=5222
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=jvbsecret
      - JVB_ADVERTISE_IPS=172.20.0.23
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=true
      - TZ=UTC
    networks:
      callzip-net:
        ipv4_address: 172.20.0.23
    ports:
      - "10000:10000/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/about/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  jitsi-web:
    profiles: [jitsi]
    build:
      context: docker/jitsi
    image: callzip-jitsi-web:latest
    restart: on-failure
    depends_on:
      jitsi-jicofo:
        condition: service_healthy
      jitsi-jvb:
        condition: service_healthy
    environment:
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - XMPP_SERVER=172.20.0.21
      - XMPP_DOMAIN=172.20.0.20
      - XMPP_AUTH_DOMAIN=auth.172.20.0.20
      - XMPP_MUC_DOMAIN=conference.172.20.0.20
      - XMPP_BOSH_URL_BASE=http://172.20.0.21:5280
      - PUBLIC_URL=https://172.20.0.20
      - TZ=UTC
    networks:
      callzip-net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "curl -kso /dev/null -w '%{http_code}' https://localhost/ | grep -q '200'"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 18

  jitsi-smoke-test:
    profiles: [jitsi]
    build:
      context: .
    image: callzip:latest
    depends_on:
      jitsi-web:
        condition: service_healthy
    networks:
      - callzip-net
    volumes:
      - ./ci:/ci:ro
    entrypoint:
      - /bin/sh
      - /ci/smoke-test.sh
      - /ci/jitsi-smoke.yml
      - "http://localhost:9090/health"   # SUCCESS_PATTERN
      - "300"                            # timeout in seconds
