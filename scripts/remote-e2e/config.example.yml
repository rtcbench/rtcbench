# Remote e2e test configuration for call.zip.
# Copy to config.yml and fill in your machine IPs.
#
# Requires ssh-parallel-test (git@github.com:ioqr/ssh-parallel-test.git)
# at ~/ssh-parallel-test/ (or set SPT_DIR in Makefile).
#
# Run: make remote-run REMOTE_CFG=scripts/remote-e2e/config.yml

project: project.yml

machines:
  - host: 192.168.1.10          # hostname or IP
    user: ubuntu                 # SSH user
    slots: 3                     # max concurrent plugins (default: 3)
  - host: 192.168.1.11
    user: ubuntu
    slots: 3
